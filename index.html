<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            color: white;

            background:
                radial-gradient(circle at 50% 45%,
                    rgba(150, 65, 200, 0.35),
                    transparent 35%),
                radial-gradient(circle at 50% 80%,
                    rgba(90, 30, 130, 0.20),
                    transparent 35%),
                linear-gradient(145deg,
                    #05030a,
                    #12071d,
                    #07030d);
        }


        /* ---------- STARS ---------- */

        .stars {
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(circle,
                    rgba(255, 255, 255, 0.9) 0 1px,
                    transparent 1.5px),
                radial-gradient(circle,
                    rgba(255, 220, 255, 0.8) 0 1px,
                    transparent 1.5px);

            background-size:
                75px 82px,
                115px 125px;

            background-position:
                15px 20px,
                40px 70px;

            opacity: 0.65;

            animation: stars 15s linear infinite;
        }

        @keyframes stars {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-40px);
            }
        }


        /* ---------- PURPLE GLOW ---------- */

        .glow {
            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(170, 70, 220, 0.35),
                    rgba(110, 30, 150, 0.15),
                    transparent 70%);

            filter: blur(20px);

            animation: glow 4s ease-in-out infinite alternate;
        }

        @keyframes glow {

            from {
                transform: scale(0.9);
                opacity: 0.7;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }


        /* ---------- MAIN ---------- */

        .page {

            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* ---------- CONTENT ---------- */

        .content {

            position: relative;

            z-index: 5;

            width: 90%;
            max-width: 450px;

            padding: 25px;

            animation: appear 1.8s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* ---------- TOP HEART ---------- */

        .heart-top {

            font-size: 30px;

            color: #ffb8f5;

            margin-bottom: 18px;

            text-shadow:
                0 0 15px #ff5de1,
                0 0 30px #a94cff;

            animation: heartBeat 2s infinite;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        /* ---------- HEY ---------- */

        .hey {

            font-size: 32px;

            font-style: italic;

            color: #e8a8ff;

            margin-bottom: 5px;

            text-shadow:
                0 0 15px rgba(230, 130, 255, 0.6);
        }


        /* ---------- MAIN HEADING ---------- */

        h1 {

            margin: 0;

            font-size: clamp(36px, 9vw, 54px);

            line-height: 1.05;

            font-weight: 400;

            letter-spacing: -1px;

            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.7),
                0 0 25px rgba(200, 80, 255, 0.45);
        }

        h1 span {

            color: #f09bea;

        }


        /* ---------- DIVIDER ---------- */

        .divider {

            margin: 25px auto 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #ff9eea;

            font-size: 18px;
        }

        .divider::before,
        .divider::after {

            content: "";

            width: 55px;

            height: 1px;

            background:
                linear-gradient(to right,
                    transparent,
                    #ff8de9);
        }

        .divider::after {

            background:
                linear-gradient(to left,
                    transparent,
                    #ff8de9);
        }


        /* ---------- MESSAGE ---------- */

        .message {

            margin: 0 auto 35px;

            max-width: 350px;

            font-size: 17px;

            line-height: 1.75;

            color: rgba(255, 255, 255, 0.82);

        }


        /* ---------- BUTTON ---------- */

        .button {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 200px;

            padding: 16px 30px;

            border-radius: 50px;

            border: 1px solid #ff9bea;

            color: white;

            text-decoration: none;

            font-size: 15px;

            letter-spacing: 2px;

            background:
                rgba(170, 60, 200, 0.18);

            box-shadow:

                0 0 10px rgba(255, 100, 230, 0.6),

                0 0 30px rgba(190, 70, 255, 0.35),

                inset 0 0 15px rgba(255, 100, 230, 0.15);

            backdrop-filter: blur(10px);

            transition: 0.35s ease;

        }

        .button:hover {

            transform: scale(1.07);

            background:
                rgba(210, 80, 220, 0.28);

            box-shadow:

                0 0 20px #ff8dea,

                0 0 50px rgba(190, 70, 255, 0.55);

        }


        /* ---------- BOTTOM ---------- */

        .bottom {

            position: absolute;

            bottom: 28px;

            left: 0;
            right: 0;

            z-index: 5;

            font-size: 13px;

            font-style: italic;

            color: rgba(255, 190, 250, 0.75);

            letter-spacing: 2px;

        }


        /* ---------- FLOATING HEARTS ---------- */

        .heart {

            position: absolute;

            bottom: -30px;

            color: #ff8eea;

            font-size: 17px;

            opacity: 0;

            animation:
                floatHeart 8s linear infinite;

            text-shadow:
                0 0 10px #ff5de1;
        }

        .heart:nth-of-type(1) {

            left: 10%;
            animation-delay: 0s;

        }

        .heart:nth-of-type(2) {

            left: 25%;
            animation-delay: 2s;

        }

        .heart:nth-of-type(3) {

            left: 70%;
            animation-delay: 1s;

        }

        .heart:nth-of-type(4) {

            left: 88%;
            animation-delay: 3s;

        }

        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0) scale(0.7);

                opacity: 0;

            }

            15% {

                opacity: 0.7;

            }

            80% {

                opacity: 0.3;

            }

            100% {

                transform:
                    translateY(-110vh) scale(1.3);

                opacity: 0;

            }

        }
    </style>
</head>


<body>

    <div class="page">

        <div class="stars"></div>

        <div class="glow"></div>


        <!-- Floating hearts -->

        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>


        <div class="content">

            <div class="heart-top">
                ♡
            </div>


            <div class="hey">
                Hey…
            </div>


            <h1>

                I made a little<br>

                <span>piece of my heart</span><br>

                for you. ♡

            </h1>


            <div class="divider">
                ✦ ♡ ✦
            </div>


            <p class="message">

                For all the moments we've shared,<br>

                and all the ones still waiting for us.

            </p>


            <a class="button" href="page2.html">

                TAP TO BEGIN ♡

            </a>

        </div>


        <div class="bottom">

            just for you · ♡

        </div>

    </div>

</body>

</html>
